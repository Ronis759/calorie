name: Сборка APK (подписанный)

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'help.html'
      - 'sw.js'
      - 'manifest.json'
      - 'zxing.min.js'
      - 'icon-*.png'
      - 'VERSION'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Собрать подписанный APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники приложения
        uses: actions/checkout@v4

      - name: Подготовить Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить компоненты Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Собрать папку www для Android-оболочки
        run: |
          mkdir -p www
          # VERSION обязателен: он входит в список кэша sw.js (MUST), без него Service Worker
          # получит 404 при установке и не поставится — из-за этого в APK не работало обновление.
          cp index.html help.html sw.js manifest.json zxing.min.js icon-180.png icon-192.png icon-512.png VERSION www/
          ls -l www
          # Проверяем, что в www лежит именно текущая версия и что VERSION в списке кэша SW есть физически.
          test -s www/VERSION || { echo "::error::www/VERSION отсутствует или пуст"; exit 1; }
          test "$(tr -d '\r\n' < www/VERSION)" = "$(tr -d '\r\n' < VERSION)" || { echo "::error::версия в www не совпадает с VERSION"; exit 1; }
          grep -q "'VERSION'" www/sw.js || { echo "::error::sw.js не кэширует VERSION"; exit 1; }
          grep -q "APP_VERSION='$(tr -d '\r\n' < VERSION)'" www/index.html || { echo "::error::APP_VERSION в index.html не совпадает с VERSION"; exit 1; }
          # Проверяем КАЖДЫЙ файл из списков кэша sw.js (MUST и SOFT): если обязательного нет,
          # установка SW провалится с 404, и обновление в APK/PWA перестанет работать.
          FILES=$(sed -n "s/^\(MUST\|SOFT\)=\[\(.*\)\][,;]*$/\2/p" www/sw.js | tr -d "'" | tr ',' ' ')
          if [ -z "$FILES" ]; then echo "::error::не удалось прочитать списки MUST/SOFT из sw.js"; exit 1; fi
          echo "Файлы кэша из sw.js: $(echo $FILES | tr '\n' ' ')"
          for f in $FILES; do
            test -s "www/$f" || { echo "::error::файл из кэша sw.js отсутствует или пуст: www/$f"; exit 1; }
          done
          echo "Все файлы кэша на месте."
          echo "Проверка версии пройдена: $(tr -d '\r\n' < www/VERSION)"

      - name: Подставить версию
        run: |
          VER=$(tr -d '\r\n' < VERSION)
          # versionCode = major*10000 + minor*100 + patch.
          # 12.22 -> 122200, 12.20 -> 122000, 12.2 -> 120200. Растёт без коллизий.
          # Старая схема `tr -d '.'` ломалась: 12.9 и 12.90 давали одно и то же число.
          CODE=$(echo "$VER" | awk -F. '{printf "%d", $1*10000 + $2*100 + (($3=="")?0:$3)}')
          if [ -z "$CODE" ] || [ "$CODE" -lt 1 ] 2>/dev/null; then echo "::error::не удалось вычислить versionCode из '$VER'"; exit 1; fi
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VER}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${CODE}/" android/app/build.gradle
          grep -E 'version(Code|Name)' android/app/build.gradle
          echo "Версия: $VER (versionCode $CODE)"

      - name: Восстановить ключ подписи из секретов
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Раньше при отсутствии секретов сборка молча делала отладочный APK и выглядела успешной.
          # Теперь это ошибка: неподписанный APK нельзя поставить поверх установленного приложения.
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты подписи:$missing. Добавьте их в Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Ключ подписи пустой после декодирования"; exit 1; }
          ls -l "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android
          # cap sync копирует www/ в android/app/src/main/assets/public.
          # Если там осталась старая версия — APK соберётся с устаревшим приложением.
          PUBLIC=android/app/src/main/assets/public
          test -f "$PUBLIC/VERSION" || { echo "::error::VERSION не попал в assets/public"; exit 1; }
          echo "Версия в assets/public: $(tr -d '\r\n' < "$PUBLIC/VERSION")"
          grep -q "APP_VERSION='$(tr -d '\r\n' < VERSION)'" "$PUBLIC/index.html" || { echo "::error::в assets/public лежит старая версия index.html"; exit 1; }

      - name: Собрать APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        id: rename
        run: |
          VER=$(tr -d '\r\n' < VERSION)
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          OUT="calorie-${VER}-signed.apk"
          test -f "$SRC" || { echo "::error::APK не создан: $SRC"; exit 1; }
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "Собран файл: $OUT"

      - name: Проверить подпись
        run: |
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.rename.outputs.apk }}"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          # Дополнительно убеждаемся, что APK действительно подписан (не только что файл существует).
          "$BT/apksigner" verify "$APK" || { echo "::error::APK не прошёл проверку подписи"; exit 1; }
          echo "Подпись APK проверена."

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-apk-release
          path: ${{ steps.rename.outputs.apk }}
          if-no-files-found: error
